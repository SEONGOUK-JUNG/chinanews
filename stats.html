<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CHINANEWS 접속 통계</title>
<style>
  :root{--bg:#000;--card:#0a0a0a;--line:#1f1f1f;--line2:#2a2a2a;--text:#e8e8e8;--dim:#a8a8a8;--orange:#E8C078;--up:#ff3b3b;--down:#1aff66}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter","Noto Sans KR","Malgun Gothic",-apple-system,sans-serif;padding:20px 16px 60px;max-width:1100px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px;color:var(--orange)}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--line2);border-top:2px solid var(--orange);border-radius:4px;padding:14px 16px}
  .card .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
  .card .val{font-size:26px;font-weight:800;font-family:"JetBrains Mono",Consolas,monospace}
  .card .val small{font-size:12px;color:var(--dim);font-weight:600;font-family:inherit}
  .card .hint{font-size:11px;color:#777;margin-top:4px}
  h2{font-size:13px;margin:26px 0 10px;color:var(--orange);text-transform:uppercase;letter-spacing:1.2px;border-bottom:1px solid var(--line2);padding-bottom:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.8px}
  td.path{max-width:420px;overflow:hidden;text-overflow:ellipsis;font-family:"JetBrains Mono",Consolas,monospace;font-size:12px}
  .bar{height:6px;background:var(--orange);border-radius:3px;display:inline-block;min-width:2px;vertical-align:middle}
  .wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:4px 12px}
  .zero{color:#555}
  .err{background:#2a0f14;border:1px solid #6b2e3c;padding:14px;border-radius:6px;color:#ff8fa3}
  .foot{margin-top:26px;color:#777;font-size:12px;line-height:1.7}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.cols{grid-template-columns:1fr}}
  a{color:var(--orange)}
</style>
</head>
<body>
<h1>CHINANEWS 접속 통계</h1>
<div class="sub" id="sub">불러오는 중…</div>
<div id="app"></div>

<script>
const KEY = new URLSearchParams(location.search).get('key') || 'chinanews2026';
const DAYS = Math.min(Number(new URLSearchParams(location.search).get('days')) || 30, 90);
const API = 'https://chinanews-ai.koreagwangju.workers.dev/stats?days=' + DAYS + '&key=' + encodeURIComponent(KEY);
const FLAG = { KR:'🇰🇷 한국', US:'🇺🇸 미국', JP:'🇯🇵 일본', CN:'🇨🇳 중국', HK:'🇭🇰 홍콩', TW:'🇹🇼 대만', SG:'🇸🇬 싱가포르', VN:'🇻🇳 베트남', IN:'🇮🇳 인도', DE:'🇩🇪 독일', GB:'🇬🇧 영국', XX:'기타' };
const PLAT = { desktop:'PC', mobile:'모바일', tablet:'태블릿' };
const LANG = { en:'영어(/)', ko:'한국어(/ko/)' };
const SECTION = { home:'홈(터미널)', supply:'공급·견적', commodity:'품목 페이지', daily:'일일 시황', commodities:'전체 목록', about:'소개', press:'보도자료', other:'기타' };

function esc(s){ const d=document.createElement('div'); d.textContent=String(s); return d.innerHTML; }
function card(l,v,u,hint){ return '<div class="card"><div class="lbl">'+esc(l)+'</div><div class="val">'+Number(v).toLocaleString()+(u?' <small>'+esc(u)+'</small>':'')+'</div>'+(hint?'<div class="hint">'+esc(hint)+'</div>':'')+'</div>'; }
function row(label,v,max,cls){ return '<tr><td'+(cls?' class="'+cls+'"':'')+'>'+esc(label)+'</td><td><span class="bar" style="width:'+Math.round(v/Math.max(1,max)*120)+'px"></span> '+Number(v).toLocaleString()+'</td></tr>'; }
function emptyRow(){ return '<tr><td class="zero" colspan="2">아직 데이터 없음</td></tr>'; }
function topN(obj,n){ return Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]).slice(0,n); }
function sumObj(days,k){ const o={}; days.forEach(d=>{ Object.entries(d[k]||{}).forEach(([a,b])=>{ o[a]=(o[a]||0)+b; }); }); return o; }

fetch(API).then(r=>{ if(!r.ok) throw new Error(r.status===401?'접속 키가 올바르지 않습니다':'서버 오류 '+r.status); return r.json(); })
.then(function(d){
  const days = d.days || [];
  const today = days[0] || {};
  const all = d.all || {};
  const sum = k => days.reduce((a,x)=>a+(x[k]||0),0);
  const d7 = days.slice(0,7);
  const actDays = days.filter(x=>(x.total||0)>0).length;

  let h = '<h2 style="margin-top:0">오늘 ('+esc(today.date||'')+')</h2><div class="cards">'
    + card('방문자', today.users||0, '명', '오늘 들어온 사람 수')
    + card('페이지뷰', today.total||0, '회', '열린 페이지 수')
    + card('첫 방문', today.newUsers||0, '명', '처음 온 사람')
    + card('1인당 페이지', (today.users||0)>0 ? ((today.total||0)/today.users).toFixed(1) : '0', '회')
    + '</div>';

  h += '<h2>최근 '+DAYS+'일</h2><div class="cards">'
    + card('7일 방문자', d7.reduce((a,x)=>a+(x.users||0),0), '명')
    + card('7일 페이지뷰', d7.reduce((a,x)=>a+(x.total||0),0), '회')
    + card(DAYS+'일 방문자', sum('users'), '명')
    + card(DAYS+'일 페이지뷰', sum('total'), '회')
    + card('하루 평균 방문자', actDays ? Math.round(sum('users')/actDays*10)/10 : 0, '명', '방문 있던 날 기준')
    + '</div>';

  h += '<h2>누계 <span style="color:var(--dim);font-weight:400;font-size:11px;text-transform:none;letter-spacing:0">'+(all.since?'('+esc(all.since)+' 부터)':'')+'</span></h2><div class="cards">'
    + card('총 방문자', all.newUsers||0, '명', '중복 없는 사람 수')
    + card('총 페이지뷰', all.total||0, '회')
    + card('방문자×일', all.userDays||0, '', '재방문 지표')
    + '</div>';

  const paths = sumObj(days,'path'), secs = sumObj(days,'section'), refs = sumObj(days,'ref'), langs = sumObj(days,'lang'), plats = sumObj(days,'platform');
  h += '<div class="cols"><div>';
  h += '<h2>많이 본 페이지 <span style="color:var(--dim);font-weight:400;font-size:11px;text-transform:none;letter-spacing:0">('+DAYS+'일)</span></h2><div class="wrap"><table>';
  const pr = topN(paths,25); h += pr.length ? pr.map(([k,v])=>row(k,v,pr[0][1],'path')).join('') : emptyRow(); h += '</table></div>';
  h += '<h2>섹션별</h2><div class="wrap"><table>';
  const sr = topN(secs,10); h += sr.length ? sr.map(([k,v])=>row(SECTION[k]||k,v,sr[0][1])).join('') : emptyRow(); h += '</table></div>';
  h += '</div><div>';
  h += '<h2>유입 경로 <span style="color:var(--dim);font-weight:400;font-size:11px;text-transform:none;letter-spacing:0">(첫 페이지 기준)</span></h2><div class="wrap"><table>';
  const rr = topN(refs,15); h += rr.length ? rr.map(([k,v])=>row(k==='direct'?'직접 접속·북마크':k,v,rr[0][1])).join('') : emptyRow(); h += '</table></div>';
  h += '<h2>국가</h2><div class="wrap"><table>';
  const cr = topN(sumObj(days,'country'),12); h += cr.length ? cr.map(([k,v])=>row(FLAG[k]||k,v,cr[0][1])).join('') : emptyRow(); h += '</table></div>';
  h += '<h2>언어 · 기기</h2><div class="wrap"><table>';
  const lr = topN(langs,3), plr = topN(plats,3);
  h += lr.map(([k,v])=>row(LANG[k]||k,v,lr[0][1])).join('') + plr.map(([k,v])=>row(PLAT[k]||k,v,plr[0][1])).join('') || emptyRow();
  h += '</table></div>';
  h += '</div></div>';

  h += '<h2>날짜별</h2><div class="wrap"><table><tr><th>날짜</th><th>방문자</th><th>페이지뷰</th><th>첫 방문</th><th>PC</th><th>모바일</th><th>EN</th><th>KO</th></tr>';
  const max = Math.max(1, ...days.map(x=>x.total||0));
  h += days.map(function(x){
    const p=x.platform||{}, l=x.lang||{}, z=(x.total||0)===0?' class="zero"':'';
    return '<tr'+z+'><td>'+esc(x.date)+'</td><td>'+(x.users||0)+'</td>'
      + '<td><span class="bar" style="width:'+Math.round((x.total||0)/max*60)+'px"></span> '+(x.total||0)+'</td>'
      + '<td>'+(x.newUsers||0)+'</td><td>'+(p.desktop||0)+'</td><td>'+((p.mobile||0)+(p.tablet||0))+'</td><td>'+(l.en||0)+'</td><td>'+(l.ko||0)+'</td></tr>';
  }).join('');
  h += '</table></div>';

  h += '<div class="foot">자체 집계(Cloudflare Worker KV). 개인정보 없음 — 날짜·페이지·국가코드·기기 구분만 저장, 일별 기록은 90일 후 자동 삭제. '
     + '방문자 = 브라우저 기준(같은 사람이 다른 기기로 오면 2명). 검색엔진 봇은 자바스크립트를 실행하지 않아 대부분 집계에서 빠짐. '
     + '보조 지표: <a href="https://chinanews-kr.goatcounter.com" target="_blank" rel="noopener">GoatCounter ↗</a></div>';
  document.getElementById('app').innerHTML = h;
  document.getElementById('sub').textContent = '갱신 ' + new Date().toLocaleString('ko-KR') + ' · 최근 ' + DAYS + '일 (?days=90 으로 늘릴 수 있음)';
}).catch(function(e){
  document.getElementById('sub').textContent = '';
  document.getElementById('app').innerHTML = '<div class="err">불러오지 못했습니다: ' + esc(e.message) + '</div>';
});
</script>
</body>
</html>
